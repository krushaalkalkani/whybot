[project]
name = "whybot"
version = "0.1.0"
description = "A cited root-cause analysis agent: explains why a business metric moved, with proof."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.80",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.0",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "mcp>=1.2",
]

[tool.setuptools.packages.find]
include = ["whybot*", "bench*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["whybot", "bench"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres database (DATABASE_URL)"]
