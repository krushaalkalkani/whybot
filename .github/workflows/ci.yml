name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whybot
          POSTGRES_PASSWORD: whybot
          POSTGRES_DB: whybot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whybot -d whybot" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://whybot:whybot@localhost:5432/whybot
      DATABASE_URL_READONLY: postgresql://whybot_readonly:whybot_readonly@localhost:5432/whybot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check whybot bench tests api
      - name: Type-check
        run: .venv/bin/mypy
      - name: Benchmark files match the generator
        run: |
          .venv/bin/python -m bench.generate > /dev/null
          git diff --exit-code bench/data/v1/scenarios.jsonl bench/data/v1/documents.jsonl bench/data/v1/MANIFEST.json
      - uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-v1
      - name: Load benchmark into Postgres
        run: .venv/bin/python -m bench.load
      - name: Unit, agent and security tests
        run: .venv/bin/python -m pytest -q
      - name: Eval gate (20-scenario smoke subset, replayed from the committed LLM cache)
        run: |
          .venv/bin/python -m bench.run_eval --split dev --smoke --systems whybot --no-judge --replay \
            --cache-dir bench/cache/smoke --out /tmp/gate --threads 2
          .venv/bin/python -m bench.gate /tmp/gate/metrics.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
