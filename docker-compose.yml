# Local stack: Postgres with pgvector + the WhyBot API.
#   docker compose up        -> API on http://localhost:8000 (docs at /docs)
# The API container loads the benchmark data on first start.
# Live questions need ANTHROPIC_API_KEY in .env; cached example runs work without it.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: whybot
      POSTGRES_PASSWORD: whybot
      POSTGRES_DB: whybot
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whybot -d whybot"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://whybot:whybot@db:5432/whybot
      DATABASE_URL_READONLY: postgresql://whybot_readonly:whybot_readonly@db:5432/whybot
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHYBOT_AGENT_MODEL: ${WHYBOT_AGENT_MODEL:-claude-haiku-5-5}
      WHYBOT_JUDGE_MODEL: ${WHYBOT_JUDGE_MODEL:-claude-sonnet-5-5}
      WHYBOT_DAILY_SPEND_CAP_USD: ${WHYBOT_DAILY_SPEND_CAP_USD:-1.0}
    ports:
      - "8000:8000"
    command: sh -c "python -m bench.load --if-empty && python -m bench.examples --load && uvicorn whybot.api:app --host 0.0.0.0 --port 8000"
